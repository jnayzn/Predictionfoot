# Competitions covered by Football AI Predictor.
#
# `key` is the provider-independent identifier used everywhere in the system.
# `provider_ids` maps each data provider to its own identifier, so a new
# provider can be added without touching the prediction engine.
# `name` / `country` are used to VERIFY the provider mapping during discovery
# (a mismatch is reported as a data-quality issue, never silently accepted).
#
# To add a competition: append a new [[competitions]] block, then run
# `football-ai discover` to verify the mapping against the provider.

[[competitions]]
key = "premier_league"
name = "Premier League"
country = "England"
type = "League"
priority = 1
[competitions.provider_ids]
api_football = 39

