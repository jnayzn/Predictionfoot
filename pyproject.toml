[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "football-ai-predictor"
version = "0.11.0"
description = "Football AI Predictor - probabilistic football match analysis "
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "httpx>=0.27,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "sqlalchemy>=2.0.30,<3.0",
    "alembic>=1.13,<2.0",
    "psycopg[binary]>=3.1,<4.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "xgboost>=2.0",
    "lightgbm>=4.3",
    "mlflow-skinny>=2.12",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "aiogram>=3.4,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
    "pandas-stubs",
]
# PyTorch is optional (heavy): pip install -e ".[deep]"
deep = ["torch>=2.2"]

[project.scripts]
football-ai = "football_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
filterwarnings = [
    "error::pandas.errors.PerformanceWarning",
    "ignore::DeprecationWarning:mlflow.*",
    "ignore:.*noload.*:DeprecationWarning",
    "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# user-facing French texts use typographic dashes on purpose
"src/football_ai/bot/**" = ["RUF001"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["football_ai"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "scipy.*", "joblib.*", "xgboost.*", "lightgbm.*", "torch.*", "mlflow.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# PyTorch exposes some untyped callables (from_numpy, backward) and nn.Module is
# Any when torch is not installed (optional dependency).
module = ["football_ai.models.deep_learning.*"]
disallow_untyped_calls = false
disallow_subclassing_any = false
